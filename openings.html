<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chess — Openings</title>
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<h1>Openings</h1>
<p class="hint hidden" id="due"></p>
<nav class="menu compact">
  <a href="principles.html?v=16">Opening principles — read this first</a>
</nav>
<h2>As White</h2>
<nav id="white" class="menu compact"></nav>
<h2>As Black</h2>
<nav id="black" class="menu compact"></nav>
<p class="controls">
  <a class="icon back" href="training.html?v=16" title="Training"></a>
</p>

<script src="openings.js?v=16"></script>
<script>
(function () {
  'use strict';

  function load(key) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function pad(n) {
    return n < 10 ? '0' + n : String(n);
  }

  var d = new Date();
  var today = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

  function isDue(record) {
    if (!record) return false;

    if (record === true) return true;

    return record.due <= today;
  }

  var done = load('kindle-chess-openings') || {};
  var html = { w: [], b: [] };
  var dueCount = 0;

  for (var i = 0; i < OPENINGS.length; i++) {
    var o = OPENINGS[i];
    var record = done[o.id];
    var due = isDue(record);

    if (due) dueCount++;

    var mark = (o.starter ? '★ ' : '') + o.name + (record && !due ? ' ✓' : '') + (due ? ' — review' : '');
    var href = 'opening.html?id=' + o.id + (due ? '&mode=practice' : '') + '&v=16';
    var entry = '<a href="' + href + '"><span class="eco">' + o.eco + '</span> ' + mark + '</a>';

    if (o.starter) {
      html[o.side].unshift(entry);
    } else {
      html[o.side].push(entry);
    }
  }

  document.getElementById('white').innerHTML = html.w.join('');
  document.getElementById('black').innerHTML = html.b.join('');

  if (dueCount) {
    var dueEl = document.getElementById('due');
    dueEl.textContent = 'Due for review today: ' + dueCount;
    dueEl.className = 'hint';
  }
})();
</script>
</body>
</html>
