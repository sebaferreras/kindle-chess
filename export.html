<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chess — Export</title>
<script>document.documentElement.className = 'loading';</script>
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<h1>Export game</h1>
<div id="qr"></div>
<p class="hint" id="caption">Scan with your phone to open the game in Chess.com.</p>
<p class="controls">
  <a id="back" class="icon back" href="games.html?v=17" title="Review"></a>
</p>

<script src="qr.js?v=17"></script>
<script>
(function () {
  'use strict';

  var GAMES_KEY = 'kindle-chess-games';

  var qrEl = document.getElementById('qr');
  var captionEl = document.getElementById('caption');
  var backEl = document.getElementById('back');

  function load() {
    try {
      var raw = window.localStorage.getItem(GAMES_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function gameIdFromUrl() {
    var match = /[?&]id=(\d+)/.exec(window.location.search);

    return match ? parseInt(match[1], 10) : null;
  }

  function findGame(games, id) {
    for (var i = 0; i < games.length; i++) {
      if (games[i].id === id) return games[i];
    }

    return null;
  }

  function buildPgn(game) {
    var results = { win: '1-0', loss: '0-1', draw: '1/2-1/2' };
    var result = results[game.result] || '*';
    var date = game.date ? game.date.substr(0, 10).replace(/-/g, '.') : '????.??.??';
    var tags = [
      '[Event "Kindle Chess"]',
      '[Date "' + date + '"]',
      '[White "You"]',
      '[Black "Bot level ' + game.level + '"]',
      '[Result "' + result + '"]'
    ];

    if (game.fen) {
      tags.push('[SetUp "1"]');
      tags.push('[FEN "' + game.fen + '"]');
    }

    var moves = [];

    for (var i = 0; i < game.history.length; i += 2) {
      var pair = (i / 2 + 1) + '. ' + game.history[i];

      if (game.history[i + 1]) pair += ' ' + game.history[i + 1];

      moves.push(pair);
    }

    return tags.join('\n') + '\n\n' + moves.join(' ') + ' ' + result + '\n';
  }

  var game = findGame(load() || [], gameIdFromUrl());

  if (!game) {
    captionEl.textContent = 'Game not found.';
    return;
  }

  backEl.href = 'review.html?id=' + game.id + '&v=17';

  var url = 'https://www.chess.com/analysis?pgn=' + encodeURIComponent(buildPgn(game));
  var qr = qrcode(0, 'L');
  qr.addData(url);
  qr.make();
  qrEl.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });

  var svg = qrEl.getElementsByTagName('svg')[0];
  var size = Math.round(Math.min(document.body.clientWidth * 0.85, 384));
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
})();
</script>
<script>document.documentElement.className = '';</script>
</body>
</html>
