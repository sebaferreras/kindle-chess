<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chess — Puzzles</title>
<script>document.documentElement.className = 'loading';</script>
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<table id="board"></table>
<p id="task"></p>
<p id="status"></p>
<p class="controls">
  <a class="icon back" href="index.html?v=15" title="Menu"></a>
  <select id="theme" title="Theme"></select>
  <button id="solution">Show solution</button>
  <button id="next">Next</button>
</p>

<script src="chess.js?v=15"></script>
<script src="board.js?v=15"></script>
<script src="puzzles.js?v=15"></script>
<script>
(function () {
  'use strict';

  var PROGRESS_KEY = 'kindle-chess-puzzles';
  var DAILY_KEY = 'kindle-chess-daily';
  var START_RATING = 1200;
  var RANGE = 150;
  var DAILY_RANGE = 300;
  var THEME_NAMES = {
    mate: 'mate', mateIn1: 'mate in 1', mateIn2: 'mate in 2', mateIn3: 'mate in 3', mateIn4: 'mate in 4',
    fork: 'fork', pin: 'pin', skewer: 'skewer', discoveredAttack: 'discovered attack',
    discoveredCheck: 'discovered check', hangingPiece: 'hanging piece', trappedPiece: 'trapped piece',
    sacrifice: 'sacrifice', deflection: 'deflection', attraction: 'attraction', clearance: 'clearance',
    intermezzo: 'intermezzo', quietMove: 'quiet move', defensiveMove: 'defensive move',
    advancedPawn: 'advanced pawn', promotion: 'promotion', exposedKing: 'exposed king',
    kingsideAttack: 'kingside attack', queensideAttack: 'queenside attack',
    rookEndgame: 'rook endgame', pawnEndgame: 'pawn endgame', queenEndgame: 'queen endgame',
    bishopEndgame: 'bishop endgame', knightEndgame: 'knight endgame', queenRookEndgame: 'queen and rook endgame',
    backRankMate: 'back rank mate', smotheredMate: 'smothered mate', doubleCheck: 'double check',
    zugzwang: 'zugzwang', crushing: 'crushing advantage', advantage: 'advantage', equality: 'equality',
    capturingDefender: 'capturing the defender', interference: 'interference', xRayAttack: 'x-ray attack',
    enPassant: 'en passant', castling: 'castling', underPromotion: 'underpromotion', arabianMate: 'Arabian mate',
    anastasiaMate: "Anastasia's mate", bodenMate: "Boden's mate", hookMate: 'hook mate',
    dovetailMate: 'dovetail mate', doubleBishopMate: 'double bishop mate'
  };

  var THEME_FILTERS = [
    ['', 'All themes'],
    ['mateIn1', 'Mate in 1'],
    ['mateIn2', 'Mate in 2'],
    ['mate', 'Mate'],
    ['fork', 'Fork'],
    ['pin', 'Pin'],
    ['skewer', 'Skewer'],
    ['discoveredAttack', 'Discovered attack'],
    ['hangingPiece', 'Hanging piece'],
    ['sacrifice', 'Sacrifice'],
    ['deflection', 'Deflection'],
    ['defensiveMove', 'Defensive move'],
    ['advancedPawn', 'Advanced pawn'],
    ['kingsideAttack', 'Kingside attack'],
    ['rookEndgame', 'Rook endgame'],
    ['pawnEndgame', 'Pawn endgame']
  ];

  var taskEl = document.getElementById('task');
  var statusEl = document.getElementById('status');
  var solutionEl = document.getElementById('solution');
  var nextEl = document.getElementById('next');
  var themeEl = document.getElementById('theme');
  var board = new Board(document.getElementById('board'), onSquareTap);
  var progress = load() || { rating: START_RATING, solved: {}, failed: {}, current: null };
  var dailyMode = /[?&]daily=1/.test(window.location.search);
  var daily = loadDaily() || { assigned: null, lastDone: null, streak: 0, best: 0 };
  var puzzle, state, solution, step, failedThisPuzzle, sawSolution, locked;

  function load() {
    try {
      var raw = window.localStorage.getItem(PROGRESS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function save() {
    try {
      window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    } catch (e) {}
  }

  function loadDaily() {
    try {
      var raw = window.localStorage.getItem(DAILY_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function saveDaily() {
    try {
      window.localStorage.setItem(DAILY_KEY, JSON.stringify(daily));
    } catch (e) {}
  }

  function pad(n) {
    return n < 10 ? '0' + n : String(n);
  }

  function dateKey(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function dailyPuzzle() {
    var today = dateKey(new Date());

    if (daily.assigned && daily.assigned.date === today) {
      var assigned = findById(daily.assigned.id);

      if (assigned) return assigned;
    }

    var seed = parseInt(today.replace(/-/g, ''), 10);
    var candidates = [];

    for (var i = 0; i < PUZZLES.length; i++) {
      var p = PUZZLES[i];
      var fresh = !progress.solved[p.id] && !progress.failed[p.id];

      if (fresh && Math.abs(p.rating - progress.rating) <= DAILY_RANGE) candidates.push(p);
    }

    if (!candidates.length) candidates = PUZZLES;

    var pick = candidates[(seed * 48271) % candidates.length];
    daily.assigned = { date: today, id: pick.id };
    saveDaily();

    return pick;
  }

  function markDailyDone() {
    var today = dateKey(new Date());

    if (daily.lastDone === today) return;

    var yesterday = dateKey(new Date(Date.now() - 86400000));
    daily.streak = daily.lastDone === yesterday ? daily.streak + 1 : 1;
    daily.best = Math.max(daily.best, daily.streak);
    daily.lastDone = today;
    saveDaily();
  }

  function currentStreak() {
    var today = dateKey(new Date());
    var yesterday = dateKey(new Date(Date.now() - 86400000));

    return daily.lastDone === today || daily.lastDone === yesterday ? daily.streak : 0;
  }

  function scoreText() {
    return dailyMode ? 'Streak: ' + currentStreak() + ' · Best: ' + daily.best : 'Your rating: ' + progress.rating;
  }

  function findById(id) {
    for (var i = 0; i < PUZZLES.length; i++) {
      if (PUZZLES[i].id === id) return PUZZLES[i];
    }

    return null;
  }

  function currentOrNewPuzzle() {
    var current = progress.current && findById(progress.current);

    return current || pickPuzzle();
  }

  function isFresh(p) {
    return !progress.solved[p.id] && !progress.failed[p.id];
  }

  function pickPuzzle() {
    var theme = progress.theme || '';
    var themed = [];
    var inRange = [];

    for (var i = 0; i < PUZZLES.length; i++) {
      var p = PUZZLES[i];

      if (theme && p.themes.indexOf(theme) === -1) continue;

      themed.push(p);

      if (isFresh(p) && Math.abs(p.rating - progress.rating) <= RANGE) inRange.push(p);
    }

    var candidates = inRange;

    if (!candidates.length) candidates = themed.filter(isFresh);

    if (!candidates.length) candidates = themed;

    if (!candidates.length) candidates = PUZZLES;

    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  var GENERIC_THEMES = ['mate', 'crushing', 'advantage', 'equality'];

  function themeLabel(themes) {
    var specific = [];
    var generic = [];

    for (var i = 0; i < themes.length; i++) {
      var name = THEME_NAMES[themes[i]] || themes[i];

      if (GENERIC_THEMES.indexOf(themes[i]) === -1) {
        specific.push(capitalize(name));
      } else {
        generic.push(capitalize(name));
      }
    }

    var chosen = specific.length ? specific : generic;

    return chosen.slice(0, 2).join(' · ');
  }

  function capitalize(text) {
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function startPuzzle(p) {
    puzzle = p;

    if (!dailyMode) {
      progress.current = p.id;
      save();
    }
    state = Chess.fromFen(p.fen);
    solution = p.moves.split(' ');
    step = 0;
    failedThisPuzzle = false;
    sawSolution = false;
    locked = true;
    board.select(null);
    board.mark([]);
    board.setFlipped(state.turn === 'w');
    board.setPosition(state.pieces);
    showInfo();
    solutionEl.disabled = false;
    nextEl.disabled = false;
    window.setTimeout(playOpponentMove, 600);
  }

  function playOpponentMove() {
    var uci = solution[step];
    state = Chess.applyMove(state, uci.substr(0, 2), uci.substr(2, 2));
    step++;
    board.setPosition(state.pieces);
    board.mark([uci.substr(0, 2), uci.substr(2, 2)]);
    locked = false;
  }

  function ownPiece(square) {
    var piece = state.pieces[square];

    return piece && piece.charAt(0) === state.turn;
  }

  function onSquareTap(square) {
    if (locked) return;

    var selected = board.selected;

    if (!selected) {
      if (ownPiece(square)) board.select(square);
      return;
    }

    if (square === selected) {
      board.select(null);
      return;
    }

    if (Chess.legalMoves(state, selected).indexOf(square) === -1) {
      board.select(ownPiece(square) ? square : null);
      return;
    }

    board.select(null);
    tryMove(selected, square);
  }

  function tryMove(from, to) {
    var expected = solution[step].substr(0, 4);

    if (from + to !== expected) {
      fail(from, to);
      return;
    }

    state = Chess.applyMove(state, from, to);
    step++;
    board.mark([]);
    board.setPosition(state.pieces);

    if (step >= solution.length) {
      succeed();
    } else {
      locked = true;
      window.setTimeout(playOpponentMove, 500);
    }
  }

  function fail(from, to) {
    locked = true;

    if (!failedThisPuzzle && !sawSolution) {
      failedThisPuzzle = true;

      if (!dailyMode) {
        progress.failed[puzzle.id] = true;
        adjustRating(false);
      }
    }

    board.setPosition(Chess.applyMove(state, from, to).pieces);
    board.mark([from, to]);
    statusEl.textContent = 'Incorrect · ' + scoreText();
    window.setTimeout(undoWrongMove, 1200);
  }

  function undoWrongMove() {
    board.setPosition(state.pieces);
    board.mark([]);
    statusEl.textContent = 'Try again · ' + scoreText();
    locked = false;
  }

  function succeed() {
    locked = true;
    solutionEl.disabled = true;

    if (dailyMode) {
      progress.solved[puzzle.id] = true;
      save();
      markDailyDone();
    } else {
      if (!failedThisPuzzle && !sawSolution) {
        progress.solved[puzzle.id] = true;
        adjustRating(true);
      }

      progress.current = null;
      save();
    }

    statusEl.textContent = (sawSolution ? 'Correct (with help)' : 'Correct') + ' · ' + scoreText();
  }

  function showInfo() {
    var side = state.turn === 'w' ? 'Black' : 'White';
    taskEl.textContent = side + ' to play · ' + themeLabel(puzzle.themes);

    if (dailyMode) {
      var done = daily.lastDone === dateKey(new Date());
      statusEl.textContent = 'Daily puzzle ' + puzzle.rating + (done ? ' · Done today' : '') + ' · ' + scoreText();
    } else {
      statusEl.textContent = 'Puzzle ' + puzzle.rating + ' · Your rating: ' + progress.rating;
    }
  }

  function adjustRating(won) {
    var expected = 1 / (1 + Math.pow(10, (puzzle.rating - progress.rating) / 400));
    progress.rating = Math.round(progress.rating + 32 * ((won ? 1 : 0) - expected));
    save();
  }

  solutionEl.onclick = function () {
    sawSolution = true;
    solutionEl.disabled = true;
    statusEl.textContent = 'Solution: ' + solutionText();
  };

  function solutionText() {
    var s = Chess.fromFen(puzzle.fen);
    var parts = [];

    for (var i = 1; i < solution.length; i++) {
      var from = solution[i].substr(0, 2);
      var to = solution[i].substr(2, 2);
      var text = Chess.notation(s, from, to);
      s = Chess.applyMove(s, from, to);
      parts.push(i % 2 === 1 ? text : '(' + text + ')');
    }

    return parts.join(' ');
  }

  nextEl.onclick = function () {
    startPuzzle(pickPuzzle());
  };

  for (var f = 0; f < THEME_FILTERS.length; f++) {
    var option = document.createElement('option');
    option.value = THEME_FILTERS[f][0];
    option.textContent = THEME_FILTERS[f][1];
    themeEl.appendChild(option);
  }

  themeEl.value = progress.theme || '';

  themeEl.onchange = function () {
    progress.theme = themeEl.value;
    progress.current = null;
    save();
    startPuzzle(pickPuzzle());
  };

  if (dailyMode) {
    nextEl.className = 'hidden';
    themeEl.className = 'hidden';
  }

  startPuzzle(dailyMode ? dailyPuzzle() : currentOrNewPuzzle());
  board.fitToScreen();
})();
</script>
<script>document.documentElement.className = '';</script>
</body>
</html>
